name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Branch guard & info (prevent accidental deploys)
        run: |
          mkdir -p $GITHUB_WORKSPACE/deploy-logs
          BRANCH_NAME="${{ github.ref_name }}"
          echo "branch_name=$BRANCH_NAME" > $GITHUB_WORKSPACE/deploy-logs/branch_check.out
          echo "event_name=${{ github.event_name }}" >> $GITHUB_WORKSPACE/deploy-logs/branch_check.out

          # Allow deploys only from main or deploy, or when manually triggered
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "allowed_by=workflow_dispatch" >> $GITHUB_WORKSPACE/deploy-logs/branch_check.out
          elif [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "deploy" ]; then
            echo "allowed_by=branch" >> $GITHUB_WORKSPACE/deploy-logs/branch_check.out
          else
            echo "allowed_by=none" >> $GITHUB_WORKSPACE/deploy-logs/branch_check.out
            echo "Deploys are blocked for branch $BRANCH_NAME. Allowed branches: main, deploy. Use manual run if needed." >> $GITHUB_WORKSPACE/deploy-logs/branch_check.out
            cat $GITHUB_WORKSPACE/deploy-logs/branch_check.out
            exit 1
          fi

      - name: Upload branch-check artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-check
          path: deploy-logs/branch_check.out

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/private_key
          chmod 600 ~/.ssh/private_key

          ssh-keyscan -p 65002 145.79.28.1 >> ~/.ssh/known_hosts

      - name: Validate SSH private key (diagnostic)
        run: |
          mkdir -p $GITHUB_WORKSPACE/deploy-logs
          echo "=== private key check ===" > $GITHUB_WORKSPACE/deploy-logs/key_check.out
          if [ ! -s ~/.ssh/private_key ]; then
            echo "PRIVATE_KEY_MISSING_OR_EMPTY" >> $GITHUB_WORKSPACE/deploy-logs/key_check.out
            echo "Ensure the repository secret HOSTINGER_SSH_KEY is set and contains the full private key with BEGIN/END lines." >> $GITHUB_WORKSPACE/deploy-logs/key_check.out
            exit 2
          fi
          if ! grep -E "BEGIN (RSA|OPENSSH) PRIVATE KEY" ~/.ssh/private_key >/dev/null 2>&1; then
            echo "PRIVATE_KEY_MISSING_HEADER" >> $GITHUB_WORKSPACE/deploy-logs/key_check.out
            echo "The private key appears malformed or missing BEGIN/END header. Use printf '%s\n' \"\${{ secrets.HOSTINGER_SSH_KEY }}\" to preserve newlines when setting the secret." >> $GITHUB_WORKSPACE/deploy-logs/key_check.out
            exit 2
          fi
          echo "PRIVATE_KEY_OK" >> $GITHUB_WORKSPACE/deploy-logs/key_check.out

      - name: Upload key check artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-check
          path: deploy-logs/key_check.out

      - name: SSH connectivity test (diagnostic)
        run: |
          mkdir -p $GITHUB_WORKSPACE/deploy-logs
          echo "=== SSH connectivity test ===" > $GITHUB_WORKSPACE/deploy-logs/ssh_test.out
          ssh -i ~/.ssh/private_key -p 65002 -o BatchMode=yes -o ConnectTimeout=10 u321426185@145.79.28.1 "echo REMOTE_OK" >> $GITHUB_WORKSPACE/deploy-logs/ssh_test.out 2>&1 || true
          echo "=== ssh exit code ===" >> $GITHUB_WORKSPACE/deploy-logs/ssh_test.out
          ssh -i ~/.ssh/private_key -p 65002 -o BatchMode=yes -o ConnectTimeout=10 u321426185@145.79.28.1 "echo REMOTE_OK" >/dev/null 2>&1 || echo "SSH_FAILED" >> $GITHUB_WORKSPACE/deploy-logs/ssh_test.out || true

      - name: Upload SSH diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-diagnostics
          path: deploy-logs/ssh_test.out

      - name: Check remote host env file presence (safe)
        run: |
          mkdir -p $GITHUB_WORKSPACE/deploy-logs
          echo "=== remote env.hosting status ===" > $GITHUB_WORKSPACE/deploy-logs/env_status.out
          ssh -i ~/.ssh/private_key -p 65002 -o BatchMode=yes -o ConnectTimeout=10 u321426185@145.79.28.1 'if [ -f /home/u321426185/domains/mysamplesystem.site/vehiscan/.env.hosting ]; then stat -c "%n %s %y" /home/u321426185/domains/mysamplesystem.site/vehiscan/.env.hosting; else echo MISSING; fi' >> $GITHUB_WORKSPACE/deploy-logs/env_status.out 2>&1 || true

      - name: Upload env status artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-status
          path: deploy-logs/env_status.out

      - name: Export public key and fingerprint
        run: |
          mkdir -p $GITHUB_WORKSPACE/deploy-logs
          ssh-keygen -y -f ~/.ssh/private_key > $GITHUB_WORKSPACE/deploy-logs/public_key.pub || true
          if [ -s $GITHUB_WORKSPACE/deploy-logs/public_key.pub ]; then
            ssh-keygen -lf $GITHUB_WORKSPACE/deploy-logs/public_key.pub -E sha256 > $GITHUB_WORKSPACE/deploy-logs/public_key.fingerprint || true
          else
            echo "public_key_generation_failed" > $GITHUB_WORKSPACE/deploy-logs/public_key.fingerprint || true
          fi

      - name: Capture verbose SSH (diagnostic)
        run: |
          mkdir -p $GITHUB_WORKSPACE/deploy-logs
          ssh -i ~/.ssh/private_key -p 65002 -o BatchMode=yes -o ConnectTimeout=10 -vvv u321426185@145.79.28.1 "echo REMOTE_VERBOSE_OK" > $GITHUB_WORKSPACE/deploy-logs/ssh_verbose.out 2>&1 || true

      - name: Rsync dry-run (diagnostic)
        run: |
          mkdir -p $GITHUB_WORKSPACE/deploy-logs
          RSYNC_SSH="ssh -i ~/.ssh/private_key -p 65002 -o StrictHostKeyChecking=yes"
          rsync -avz --delete --dry-run \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude=".env.hosting" \
            --exclude=".env.production" \
            --exclude="node_modules" \
            --exclude="vendor" \
            -e "$RSYNC_SSH" ./ u321426185@145.79.28.1:/home/u321426185/domains/mysamplesystem.site/vehiscan/ > $GITHUB_WORKSPACE/deploy-logs/rsync_dryrun.out 2>&1 || true

      - name: Upload deploy diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics
          path: deploy-logs

      - name: Rsync deploy (capture real stdout/stderr)
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/deploy-logs
          RSYNC_SSH="ssh -i ~/.ssh/private_key -p 65002 -o StrictHostKeyChecking=yes -o ConnectTimeout=20"
          rsync -avz --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude=".env.hosting" \
            --exclude=".env.production" \
            --exclude="node_modules" \
            --exclude="vendor" \
            -e "$RSYNC_SSH" ./ u321426185@145.79.28.1:/home/u321426185/domains/mysamplesystem.site/vehiscan/ > $GITHUB_WORKSPACE/deploy-logs/rsync_real.out 2>&1 || true

      - name: Upload rsync real output
        uses: actions/upload-artifact@v4
        with:
          name: rsync-real-output
          path: deploy-logs/rsync_real.out

      - name: Deploy Main App to vehiscan
        run: |
          echo "Starting deployment to Hostinger..."
          sleep 3

          rsync -avz --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude=".env.hosting" \
            --exclude=".env.production" \
            --exclude="node_modules" \
            --exclude="vendor" \
            -e "ssh -i ~/.ssh/private_key -p 65002" \
            ./ \
            u321426185@145.79.28.1:/home/u321426185/domains/mysamplesystem.site/vehiscan/

          echo "Main app uploaded successfully."
          sleep 3

      - name: Install dependencies on host
        run: |
          echo "Installing composer dependencies on host..."
          ssh -i ~/.ssh/private_key -p 65002 u321426185@145.79.28.1 "
            cd /home/u321426185/domains/mysamplesystem.site/vehiscan || exit 1

            # Prefer system composer
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --prefer-dist || true

            # If composer.phar already present, use it
            elif [ -f composer.phar ]; then
              php composer.phar install --no-dev --optimize-autoloader --prefer-dist || true

            # Attempt to download composer installer and run it
            else
              echo 'Composer not found — attempting to download composer.phar installer'
              php -r "copy('https://getcomposer.org/installer','composer-setup.php');" 2>/dev/null || true
              if [ -f composer-setup.php ]; then
                php composer-setup.php --install-dir=/tmp --filename=composer.phar || true
                if [ -f /tmp/composer.phar ]; then
                  php /tmp/composer.phar install --no-dev --optimize-autoloader --prefer-dist || true
                  rm -f /tmp/composer.phar
                fi
                rm -f composer-setup.php || true
              else
                echo 'Failed to download composer installer; skipping composer install'
              fi
            fi

            # Run migrations if present (non-fatal)
            if [ -f run_migrations.php ]; then
              php run_migrations.php || true
            fi
          "
          echo "Dependency install step finished."
          sleep 2

      - name: Copy Assets to public_html
        run: |
          echo "Preparing assets folder..."
          sleep 2

          ssh -i ~/.ssh/private_key -p 65002 u321426185@145.79.28.1 "
            mkdir -p /home/u321426185/domains/mysamplesystem.site/public_html/assets
          "

          echo "Uploading assets..."
          sleep 2

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/private_key -p 65002" \
            ./assets/ \
            u321426185@145.79.28.1:/home/u321426185/domains/mysamplesystem.site/public_html/assets/

          echo "Assets uploaded successfully."
          sleep 3

      - name: Deployment Complete
        run: |
          echo "Hostinger website updated successfully."
          echo "Waiting 10 seconds before finishing..."
          sleep 10
          echo "Deployment finished."
