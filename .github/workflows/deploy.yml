name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/private_key
          chmod 600 ~/.ssh/private_key

          ssh-keyscan -p 65002 145.79.28.1 >> ~/.ssh/known_hosts

      - name: Deploy Main App to vehiscan
        run: |
          echo "Starting deployment to Hostinger..."
          sleep 3

          rsync -avz --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="vendor" \
            -e "ssh -i ~/.ssh/private_key -p 65002" \
            ./ \
            u321426185@145.79.28.1:/home/u321426185/domains/mysamplesystem.site/vehiscan/

          echo "Main app uploaded successfully."
          sleep 3

      - name: Install dependencies on host
        run: |
          echo "Installing composer dependencies on host..."
          ssh -i ~/.ssh/private_key -p 65002 u321426185@145.79.28.1 "
            cd /home/u321426185/domains/mysamplesystem.site/vehiscan || exit 1

            # Prefer system composer
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --prefer-dist || true

            # If composer.phar already present, use it
            elif [ -f composer.phar ]; then
              php composer.phar install --no-dev --optimize-autoloader --prefer-dist || true

            # Attempt to download composer installer and run it
            else
              echo 'Composer not found — attempting to download composer.phar installer'
              php -r "copy('https://getcomposer.org/installer','composer-setup.php');" 2>/dev/null || true
              if [ -f composer-setup.php ]; then
                php composer-setup.php --install-dir=/tmp --filename=composer.phar || true
                if [ -f /tmp/composer.phar ]; then
                  php /tmp/composer.phar install --no-dev --optimize-autoloader --prefer-dist || true
                  rm -f /tmp/composer.phar
                fi
                rm -f composer-setup.php || true
              else
                echo 'Failed to download composer installer; skipping composer install'
              fi
            fi

            # Run migrations if present (non-fatal)
            if [ -f run_migrations.php ]; then
              php run_migrations.php || true
            fi
          "
          echo "Dependency install step finished."
          sleep 2

      - name: Copy Assets to public_html
        run: |
          echo "Preparing assets folder..."
          sleep 2

          ssh -i ~/.ssh/private_key -p 65002 u321426185@145.79.28.1 "
            mkdir -p /home/u321426185/domains/mysamplesystem.site/public_html/assets
          "

          echo "Uploading assets..."
          sleep 2

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/private_key -p 65002" \
            ./assets/ \
            u321426185@145.79.28.1:/home/u321426185/domains/mysamplesystem.site/public_html/assets/

          echo "Assets uploaded successfully."
          sleep 3

      - name: Deployment Complete
        run: |
          echo "Hostinger website updated successfully."
          echo "Waiting 10 seconds before finishing..."
          sleep 10
          echo "Deployment finished."
